spring:
  application:
    name: viva.exam.system
  # Nạp biến DB_URL, DB_USERNAME, DB_PASSWORD từ file .env khi chạy local.
  # Biến môi trường thật (IntelliJ/CI/server) vẫn có độ ưu tiên cao hơn.
  config:
    import: optional:file:.env[.properties]

  # Đọc biến từ file .env ở thư mục gốc dự án (format giống .properties).
  # "optional:" = không có file .env cũng không lỗi, khi đó dùng giá trị mặc định sau dấu ":" bên dưới.
  # Thứ tự ưu tiên: biến môi trường hệ điều hành > .env > giá trị mặc định.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aives}
    username: ${DB_USERNAME:aives}
    password: ${DB_PASSWORD:aives}

  jpa:
    # Schema do Flyway quản lý, Hibernate chỉ kiểm tra entity có khớp bảng không.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Cấu hình riêng của AIVES
app:
  ai:
    api-key: ${AI_API_KEY:}
