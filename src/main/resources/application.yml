spring:
  application:
    name: viva.exam.system
  # Đọc biến từ file .env ở thư mục gốc dự án (format giống .properties).
  # "optional:" = không có file .env cũng không lỗi, khi đó dùng giá trị mặc định sau dấu ":" bên dưới.
  # Thứ tự ưu tiên: biến môi trường thật (IntelliJ/CI/server) > .env > giá trị mặc định.
  # LƯU Ý: mỗi key (vd "config") chỉ được xuất hiện 1 lần trong cùng 1 cấp, trùng là app không chạy.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Ưu tiên DB_URL nếu .env có khai báo; nếu không thì ghép từ DB_HOST / DB_PORT / DB_NAME
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aives}}
    username: ${DB_USERNAME:aives}
    password: ${DB_PASSWORD:aives}
    hikari:
      # Supabase gói free giới hạn số kết nối -> giữ pool nhỏ (mặc định của Spring là 10)
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    # Schema do Flyway quản lý, Hibernate chỉ kiểm tra entity có khớp bảng không.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  # Render (và hầu hết cloud) tự cấp port qua biến PORT; chạy local thì dùng SERVER_PORT / 8080
  port: ${PORT:${SERVER_PORT:8080}}
  # Render đứng sau proxy HTTPS: đọc header X-Forwarded-* để app biết request gốc là https
  # (nếu thiếu, Swagger sẽ gọi API bằng http:// và bị trình duyệt chặn)
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Cấu hình riêng của AIVES
app:
  ai:
    api-key: ${AI_API_KEY:}
