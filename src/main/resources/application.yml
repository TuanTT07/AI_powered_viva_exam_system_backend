spring:
  application:
    name: viva.exam.system
  # Nạp biến DB_URL, DB_USERNAME, DB_PASSWORD từ file .env khi chạy local.
  # Biến môi trường thật (IntelliJ/CI/server) vẫn có độ ưu tiên cao hơn.
  config:
    import: optional:file:.env[.properties]

  # Mặc định trỏ tới Postgres trong compose.yaml.
  # Muốn dùng DB khác thì set biến môi trường DB_URL / DB_USERNAME / DB_PASSWORD.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aives}
    username: ${DB_USERNAME:aives}
    password: ${DB_PASSWORD:aives}

  jpa:
    # Schema do Flyway quản lý, Hibernate chỉ kiểm tra entity có khớp bảng không.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
