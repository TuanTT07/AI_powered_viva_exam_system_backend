spring:
  application:
    name: viva.exam.system

  # Mặc định trỏ tới Postgres trong compose.yaml.
  # Muốn dùng DB khác thì set biến môi trường DB_URL / DB_USERNAME / DB_PASSWORD.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aives}
    username: ${DB_USERNAME:aives}
    password: ${DB_PASSWORD:aives}

  jpa:
    # Schema do Flyway quản lý, Hibernate chỉ kiểm tra entity có khớp bảng không.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
